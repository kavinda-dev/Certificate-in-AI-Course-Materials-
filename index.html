<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate in Artificial Intelligence - Program Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#38bdf8',
                            500: '#06b6d4',
                            600: '#0284c7',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: #080c14;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.20) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.22) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.18) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.18) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.70);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            background: rgba(30, 41, 59, 0.70);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -10px rgba(56, 189, 248, 0.25), inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        .glass-input:hover:not(:disabled) {
            border-color: rgba(56, 189, 248, 0.4);
        }
        .glass-input:focus {
            border-color: #38bdf8;
            outline: none;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        .glass-input option {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 8px;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.3); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.5); }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">

    <main class="flex-grow flex flex-col items-center pt-16 pb-16 px-6 relative w-full max-w-5xl mx-auto">
        
        <!-- Header Section -->
        <header class="text-center space-y-4 mb-14 max-w-2xl">
            <div class="inline-flex items-center justify-center gap-2.5 mb-1">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 via-blue-500 to-indigo-500 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-wand-magic-sparkles text-white text-sm"></i>
                </div>
                <span id="course-label" class="text-xs font-bold uppercase tracking-widest text-cyan-400">
                    Certificate in Artificial Intelligence
                </span>
            </div>
            
            <h1 id="page-title" class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-white via-cyan-100 to-slate-300 leading-tight">
                Program Home
            </h1>
            
            <p class="text-sm md:text-base text-slate-300 leading-relaxed">
                Select a session from any unlocked module below to launch the interactive class deck.
            </p>
        </header>

        <!-- Dynamic Module Grid -->
        <div id="module-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
            <!-- Cards will be injected here by JavaScript -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-6 border-t border-white/5 mt-auto">
        <p class="text-xs text-slate-500 font-medium">
            Certificate in Artificial Intelligence &copy; <span id="current-year"></span>
        </p>
    </footer>

    <script>
        const COURSE = {
            label: "Certificate in Artificial Intelligence",
            title: "Program Home"
        };

        document.getElementById('course-label').textContent = COURSE.label;
        document.getElementById('page-title').textContent = COURSE.title;
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // To lock or unlock an entire module, change locked: false to locked: true on the module object.
        // You can also lock individual sessions inside a module by setting locked: true on that session item.
        const MODULES = [
            {
                code: "CAIP01",
                name: "Artificial Intelligence Fundamentals (Responsible & Ethical AI)",
                lecturer: "Ms. Hashini Jayasinghe",
                description: "Core AI concepts, how large language models work, strengths and limitations, and the 5 Golden Rules for responsible AI.",
                locked: false,
                sessions: [
                    { number: 1, title: "Session 1: AI Fundamentals: Responsible & Ethical AI", link: "Session_1.html", locked: false }
                ]
            },
            {
                code: "CAIP02",
                name: "Prompt Engineering (Generative AI)",
                lecturer: "Mr. Sai Thishok",
                description: "Foundational prompt structure, role and context techniques, output formatting, image prompting, and prompt chaining.",
                locked: false,
                sessions: [
                    { number: 2, title: "Session 2: Prompt Engineering Basics (Module Session 1)", link: "Session_2.html", locked: false },
                    { number: 3, title: "Session 3: Techniques For Better Prompts (Module Session 2)", link: "Session_3.html", locked: false },
                    { number: 4, title: "Session 4: Practical Prompt Engineering (Module Session 3)", link: "Session_4.html", locked: false }
                ]
            },
            {
                code: "CAIP03",
                name: "AI in the Workplace & Personal Productivity",
                lecturer: "Mr. Tuan Wazeem",
                description: "Executive communication, C-R-E-A-T-E prompting, document synthesis, time-blocking systems, and spreadsheet formulas.",
                locked: false,
                sessions: [
                    { number: 5, title: "Session 5: Communication, Prompting & Research", link: "Session_5.html", locked: false },
                    { number: 6, title: "Session 6: Planning, Spreadsheets & AI Ethics", link: "Session_6.html", locked: false }
                ]
            },
            {
                code: "CAIP04",
                name: "AI Agents for Workplace & Personal Productivity",
                lecturer: "Mr. Sanchuka Kavinda",
                description: "Designing agentic workflows, custom AI assistants, verified web research, meeting-to-action pipelines, and mini-tools.",
                locked: false,
                sessions: [
                    { number: 7, title: "Session 7: From Chatbot to AI Agent", link: "Session_7.html", locked: false },
                    { number: 8, title: "Session 8: Build Your Own AI Assistant", link: "Session_8.html", locked: false },
                    { number: 9, title: "Session 9: AI Research Agents", link: "Session_9.html", locked: false },
                    { number: 10, title: "Session 10: Agents with Files: Meeting-to-Action Kit", link: "Session_10.html", locked: false },
                    { number: 11, title: "Session 11: Workflow Automation & Mini-Tools", link: "Session_11.html", locked: false },
                    { number: 12, title: "Session 12: Productivity Kit & Safe Use of AI Agents", link: "Session_12.html", locked: false }
                ]
            }
        ];

        function openSelectedSession(moduleIndex) {
            const selectEl = document.getElementById(`session-select-${moduleIndex}`);
            if (selectEl && selectEl.value) {
                window.location.href = selectEl.value;
            }
        }

        function renderModules() {
            const grid = document.getElementById('module-grid');
            grid.innerHTML = '';

            MODULES.forEach((mod, index) => {
                const moduleNum = index + 1;
                const sessionCount = mod.sessions ? mod.sessions.length : 0;
                const sessionLabel = sessionCount === 1 ? '1 Session' : `${sessionCount} Sessions`;

                if (mod.locked) {
                    // Locked Card
                    grid.innerHTML += `
                        <div class="glass-panel p-6 rounded-2xl flex flex-col h-full opacity-60 border border-slate-700/50 border-dashed relative">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">Module ${moduleNum} • ${mod.code}</span>
                                <div class="flex items-center gap-2">
                                    <span class="px-2.5 py-0.5 rounded-full bg-slate-800/80 border border-slate-700 text-[10px] font-semibold text-slate-400">
                                        ${sessionLabel}
                                    </span>
                                    <span class="px-2.5 py-0.5 rounded-full bg-slate-800/80 border border-slate-600/50 text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
                                        <i class="fa-solid fa-lock"></i> Locked
                                    </span>
                                </div>
                            </div>
                            <h3 class="text-xl font-bold text-slate-400 mb-2">${mod.name}</h3>
                            <p class="text-xs text-slate-500 mb-3 flex items-center gap-2">
                                <i class="fa-solid fa-chalkboard-user"></i> ${mod.lecturer}
                            </p>
                            <p class="text-xs text-slate-500 flex-grow mb-5 leading-relaxed">${mod.description}</p>
                            
                            <div class="space-y-3 mt-auto">
                                <div class="relative">
                                    <select disabled class="w-full p-2.5 pr-8 rounded-xl glass-input text-xs text-slate-500 appearance-none cursor-not-allowed opacity-60">
                                        <option>Unlocks soon (${sessionLabel})</option>
                                    </select>
                                    <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-600 pointer-events-none"></i>
                                </div>
                                <button type="button" disabled tabindex="-1" class="w-full py-3 rounded-xl bg-slate-800/50 text-slate-500 text-sm font-semibold border border-slate-700/50 cursor-not-allowed flex justify-center items-center gap-2" title="Unlocks soon">
                                    Coming Soon <i class="fa-solid fa-lock text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    // Build dropdown options for unlocked module
                    const optionsHtml = mod.sessions.map((sess) => {
                        if (sess.locked) {
                            return `<option value="" disabled>${sess.title} (Locked)</option>`;
                        }
                        return `<option value="${sess.link}">${sess.title}</option>`;
                    }).join('');

                    // Unlocked Card
                    grid.innerHTML += `
                        <div class="glass-card p-6 rounded-2xl flex flex-col h-full group relative overflow-hidden transition-all duration-300">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl -mr-10 -mt-10 group-hover:bg-cyan-500/20 transition-all duration-500 ease-out pointer-events-none"></div>
                            
                            <div class="flex justify-between items-center mb-2 relative z-10">
                                <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Module ${moduleNum} • ${mod.code}</span>
                                <span class="px-2.5 py-0.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-[10px] font-semibold text-cyan-300 flex items-center gap-1.5">
                                    <i class="fa-solid fa-layer-group text-[9px]"></i> ${sessionLabel}
                                </span>
                            </div>

                            <h3 class="text-xl font-bold text-white mb-2 relative z-10">${mod.name}</h3>
                            <p class="text-xs text-slate-300 mb-3 flex items-center gap-2 relative z-10">
                                <i class="fa-solid fa-chalkboard-user text-cyan-400"></i> ${mod.lecturer}
                            </p>
                            <p class="text-xs text-slate-300 flex-grow mb-5 leading-relaxed relative z-10">${mod.description}</p>
                            
                            <div class="space-y-3 mt-auto relative z-10">
                                <div>
                                    <label for="session-select-${index}" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
                                        Select Session (${sessionLabel})
                                    </label>
                                    <div class="relative">
                                        <select id="session-select-${index}" class="w-full p-2.5 pr-9 rounded-xl glass-input text-xs font-medium text-slate-100 appearance-none cursor-pointer">
                                            ${optionsHtml}
                                        </select>
                                        <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-cyan-400 pointer-events-none"></i>
                                    </div>
                                </div>

                                <button type="button" onclick="openSelectedSession(${index})" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-sm font-semibold flex justify-center items-center gap-2 shadow-lg shadow-cyan-500/20 transition-all duration-300 outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2 focus:ring-offset-[#080c14]">
                                    Open Session <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }
            });
        }

        document.addEventListener('DOMContentLoaded', renderModules);
    </script>
</body>
</html>
